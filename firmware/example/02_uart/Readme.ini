
 * =============================================================================
 * UART Driver Design Notes (왜 DMA/랩핑/링버퍼를 쓰는가?)
 * =============================================================================
 *
 * [1] 왜 DMA를 쓰는가?
 * -----------------------------------------------------------------------------
 * UART 수신은 "언제 데이터가 들어올지 모르는" 비동기 이벤트다.
 * 단순 폴링(RXNE를 계속 확인)이나 바이트 단위 인터럽트(IRQ)만으로 처리하면:
 *
 *  - 폴링 방식:
 *    * 메인루프가 UART만 계속 쳐다봐야 해서 CPU 낭비가 크다.
 *    * 다른 작업(모터 제어, UI, 로그, 통신 등)이 바쁘면 수신을 놓쳐 오버런(ORE) 발생 가능.
 *
 *  - 바이트 IRQ 방식:
 *    * 바이트마다 인터럽트가 발생하므로 고속(예: 115200 이상)에서 IRQ 폭주 가능.
 *    * RTOS/타이머/다른 인터럽트와 섞이면 지연(latency)로 데이터 유실 가능.
 *
 * DMA 수신을 쓰면:
 *  - UART RX 데이터를 CPU 개입 없이 메모리로 자동 이동한다. (CPU 부담 감소)
 *  - 버스트/연속 수신에서도 안정적이고, 인터럽트 빈도를 줄일 수 있다.
 *  - 시스템이 바쁜 상황에서도 "수신 유실" 가능성을 크게 낮춘다.
 *
 * 즉, DMA는 "성능"뿐 아니라 "안정성(유실 방지)" 때문에 쓴다.
 *
 *
 * [2] 왜 링버퍼(qbuffer)를 쓰는가?
 * -----------------------------------------------------------------------------
 * DMA(또는 UART HW 레지스터)에 들어온 데이터는 '어딘가'에 쌓아두고,
 * 애플리케이션이 원하는 타이밍에 꺼내 쓰도록 해야 한다.
 *
 * 링버퍼는:
 *  - Producer(수신)와 Consumer(읽기)를 분리해준다. ( EVENT 방식처럼 구독 - 소비 라고도 부르는듯 하다. )
 *  - 데이터가 들어오는 속도와 읽는 속도가 달라도 안전하게 완충(buffering)한다.
 *  - "문자열/프레임" 단위 파싱을 상위 레벨에서 편하게 할 수 있게 해준다.
 *
 *
 * [3] 왜 HAL(UART_HandleTypeDef) + 채널 테이블로 랩핑(wrapping)하는가?
 * -----------------------------------------------------------------------------
 * 프로젝트에서 UART가 여러 개(디버그, RS485, LIN, 센서 등) 동시에 쓰인다.
 * UART마다 초기화/핀/방향제어/속도/버퍼 등을 각각 if-else로 관리하면:
 *
 *  - 코드 중복이 늘고,
 *  - 채널 추가/변경 시 실수가 많아지고,
 *  - 유지보수 비용이 폭증한다.
 *
 * 그래서 이 드라이버는 "채널 번호(ch)" 하나로 모든 UART를 동일한 API로 제어한다.
 *  - uart_hw_tbl[] : (ch -> 실제 UART 하드웨어/핸들/타입) 매핑
 *  - uart_tbl[]    : (ch 별 runtime 상태) 보관
 *
 * 결과적으로:
 *  - 상위(ap) 코드는 UART가 몇 번 포트인지 몰라도 괜찮다.
 *  - "uartOpen/Available/Read/Write" 같은 공통 API만 사용하면 된다.
 *  - 새 UART 추가는 테이블 1줄 추가로 끝난다.
 
    - 위와 같은 장점으로 하여금 uart 예제로서 사용하기로 함.


